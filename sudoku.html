<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Nickname screen -->
  <section id="welcome" class="screen card">
    <h1>Welcome to Sudoku Game</h1>

    <label for="nickname">Enter your nickname</label>

    <input id="nickname" type="text" maxlength="15" placeholder="Your name">

    <button id="submitName" type="button">
      Submit
    </button>

    <p id="welcomeError" class="error"></p>
  </section>

  <!-- Game screen -->
  <section id="game" class="screen card hidden">

    <div class="game-header">
      <h2>
        Welcome <span id="playerName"></span> !
      </h2>
      <button id="logout" type="button">
        Exit The Game
      </button>
    </div>

    <div class="game-layout">

      <div>
        <div class="levels">
          <strong>Choose your puzzle:</strong>

          <button game-level="easy" type="button">
            Easy
          </button>

          <button game-level="medium" type="button">
            Medium
          </button>

          <button game-level="hard" type="button">
            Hard
          </button>
        </div>

        <div id="board" aria-label="Sudoku board"></div>

        <div class="game-actions">
          <button id="check" type="button">
            Check answer
          </button>

          <button id="reveal" type="button">
            Reveal solution
          </button>

          <button id="clear" type="button">
            Clear
          </button>
        </div>
        <p id="status"></p>
      </div>

      <aside class="rank">
        <h3>Rank:</h3>
        <div id="rankList"></div>
        <p id="playerRank"></p>
      </aside>

    </div>
  </section>



</body>

</html>
